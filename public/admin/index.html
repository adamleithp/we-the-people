<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- the editors' door, not a page of the site -->
    <meta name="robots" content="noindex" />
    <title>We The People — Edit the site</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      Sveltia CMS. It reads config.yml next to this file, signs the editor in
      against GitHub, and commits their changes to src/content/*.yml.

      The version is pinned on purpose: this page holds write access to the
      repository, so the code it loads should only ever change deliberately.
      To update, bump the number here and check that /admin still saves.
    -->
    <script
      src="https://unpkg.com/@sveltia/cms@0.217.0/dist/sveltia-cms.js"
      type="module"
    ></script>
  </head>
  <body></body>
</html>
